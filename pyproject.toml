[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duma"
version = "0.1.0"
description = "Duma, the Telegram assistant of Muungano RT"
requires-python = ">=3.11"
dependencies = [
    # 1.11 is what the caching and effort parameters were tested with.
    "anthropic>=1.11",
    "asyncpg>=0.30",
    "httpx>=0.28",
    # Charts, drawn in process: no browser, no service.
    "matplotlib>=3.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Voice notes, transcribed on this machine. About 460 MB of libraries, plus the model on first use.
voice = [
    "faster-whisper>=1.2",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

# The folder also holds prompts/, docs/ and state/: name the package so nothing else is auto-discovered.
[tool.setuptools]
packages = ["duma"]
