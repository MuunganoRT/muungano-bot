name: CI

on:
  push:
    branches: [main]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      # Las pruebas de almacenamiento corren tambien contra Postgres, que es
      # donde Duma guarda su estado en produccion. Sin esto se saltan.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # La del contenedor de Cloudron.
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Pruebas
        env:
          DUMA_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pytest -q

  desplegar:
    name: Desplegar el bot
    needs: pruebas
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-bot
      cancel-in-progress: false
    steps:
      - name: Llamar al webhook del servidor
        run: |
          set -euo pipefail
          # El receptor (/app/data/deploy/main.py) corre /app/data/deploy/deploy_bot.sh.
          codigo=$(curl -sS -o respuesta.txt -w '%{http_code}' \
            --max-time 600 --retry 2 --retry-connrefused \
            -X POST \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" \
            "https://api.muungano.mx/deploy/bot")

          cat respuesta.txt

          if [ "$codigo" -ne 200 ]; then
            echo "::error::El despliegue del bot respondio ${codigo}"
            exit 1
          fi

          # El receptor devuelve 200 tambien cuando el script falla: su
          # `except CalledProcessError` hace `return`, no `raise`. Sin esta
          # comprobacion, un despliegue roto sale verde en GitHub.
          if grep -q '"code"' respuesta.txt; then
            echo "::error::El script de despliegue del bot fallo"
            exit 1
          fi

          echo "Desplegado el bot"
